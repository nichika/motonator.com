name: Generate featured images

on:
  workflow_run:
    workflows: ["Publish new articles to WordPress"]
    types: [completed]
  schedule:
    # Cloudflare's free Workers AI allowance resets at 00:00 UTC (09:00 JST).
    # Retry daily so images that hit the daily limit are generated afterwards.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force_files:
        description: "Article files to regenerate even if they already have an image (comma-separated, e.g. daga-kotowaru.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the image optimizer
        run: npm install --no-save --no-audit --no-fund sharp

      - name: Generate and attach featured images
        env:
          WP_API_BASE: ${{ secrets.WP_API_BASE }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FORCE_FILES: ${{ inputs.force_files }}
        run: node scripts/generate-images.mjs

      - name: Commit image state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f content/.images-state.json ] && git add content/.images-state.json
          [ -f content/.images-urls.json ] && git add content/.images-urls.json
          git diff --cached --quiet || (git commit -m "Record generated image state [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done)
