name: Diagnose Cloudflare AI (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workers AI quota
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "runner time: $(date -u)"
          curl -s -D /tmp/h.txt -o /tmp/b.txt -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            -d '{"prompt":"a small orange circle on a white background","steps":4}' -w "HTTP %{http_code}\n"
          echo "--- response headers (no auth values are echoed)"
          grep -iE "^(HTTP|date|retry-after|cf-ai|x-ratelimit|content-type)" /tmp/h.txt || true
          echo "--- body (first 400 chars)"
          head -c 400 /tmp/b.txt; echo
          echo "--- token verify"
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer ${CF_API_TOKEN}" | head -c 300; echo
